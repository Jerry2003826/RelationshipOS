name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: File-size budget
        run: >
          uv run python scripts/check_file_size.py
          --rule "src/relationship_os/application/runtime_service.py<=5000"

      - name: Test
        run: uv run pytest --tb=short -q

      - name: Router holdout smoke gate
        run: uv run python router_v2/training/router_eval.py --data router_v2/training/holdout_zh.jsonl
